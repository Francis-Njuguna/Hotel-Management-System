name: Verify hotel workflows
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotel_test
          POSTGRES_USER: hotel_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: hotel_test
      POSTGRES_USER: hotel_ci
      POSTGRES_PASSWORD: ci-${{ github.run_id }}
      POSTGRES_HOST: 127.0.0.1
      HMS_ALLOWED_HOSTS: localhost,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -I -S -B -m unittest discover -s scripts -p test_demo_config.py -v
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -c "import os,secrets;open(os.environ['GITHUB_ENV'],'a').write('HMS_SECRET_KEY='+secrets.token_urlsafe(50)+'\n')"
      - working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py spectacular --file "$RUNNER_TEMP/hotel-openapi.yaml" --validate --fail-on-warn
          python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npx --no-install tsc -p e2e/tsconfig.json
      - run: npm test
