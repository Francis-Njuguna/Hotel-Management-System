name: hotel-a

x-db-name: &db-name "${POSTGRES_DB:-hotel_a}"
x-app-user: &app-user "${POSTGRES_USER:-hms_app}"
x-db-password: &db-password "${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD outside the repository}"
x-db-port: &db-port "${POSTGRES_PORT:-5432}"

x-django-env: &django-env
  HMS_SECRET_KEY: "${HMS_SECRET_KEY:?Set a unique HMS_SECRET_KEY outside the repository}"
  HMS_DEBUG: "${HMS_DEBUG:-0}"
  HMS_ALLOWED_HOSTS: "${HMS_ALLOWED_HOSTS:-127.0.0.1,localhost}"
  HMS_CSRF_TRUSTED_ORIGINS: "${HMS_CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:${HMS_HTTP_PORT:-8080},http://localhost:${HMS_HTTP_PORT:-8080}}"
  HMS_SECURE_COOKIES: "${HMS_SECURE_COOKIES:-0}"
  HMS_PUBLIC_URL: "${HMS_PUBLIC_URL:-http://127.0.0.1:${HMS_HTTP_PORT:-8080}}"
  HMS_MEDIA_ROOT: /app/media
  POSTGRES_DB: *db-name
  POSTGRES_USER: *app-user
  POSTGRES_PASSWORD: *db-password
  POSTGRES_HOST: "${POSTGRES_HOST:-db}"
  POSTGRES_PORT: *db-port

x-logs: &logs
  driver: local
  options: { max-size: "10m", max-file: "3" }

x-unprivileged: &unprivileged
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777"]
  logging: *logs

x-django: &django
  <<: *unprivileged
  build:
    context: .
    dockerfile: deploy/backend.Dockerfile
  environment: *django-env

services:
  db:
    image: postgres:17-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7
    command: ["postgres", "-c", "port=${POSTGRES_PORT:-5432}", "-c", "hba_file=/etc/hms-pg_hba.conf"]
    environment:
      POSTGRES_DB: *db-name
      POSTGRES_USER: postgres  # init/admin only, never the Django TCP login
      POSTGRES_PASSWORD: *db-password
      POSTGRES_INITDB_ARGS: "--auth-local=peer --auth-host=scram-sha-256"
      HMS_APP_USER: *app-user
      PGPORT: *db-port
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pg_socket:/var/run/postgresql
      - ./deploy/db/pg_hba.conf:/etc/hms-pg_hba.conf:ro
      - ./deploy/db/10-bootstrap.sql:/docker-entrypoint-initdb.d/10-bootstrap.sql:ro
    networks: [data]
    healthcheck:
      # TCP stays closed during initialisation. Check real app authentication too.
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}" psql -X -w -h 127.0.0.1
          -U "$${HMS_APP_USER}" -d "$${POSTGRES_DB}" -Atqc 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    logging: *logs

  migrate:
    <<: *django
    command:
      - /bin/sh
      - -ec
      - |
        python manage.py makemigrations --check --dry-run --noinput core lodging housekeeping restaurant billing parking
        exec python manage.py migrate --noinput
    environment:
      <<: *django-env
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_USER: www-data
      POSTGRES_PASSWORD: ""  # peer auth matches the Debian OS user; no DDL password
    volumes: ["pg_socket:/var/run/postgresql:ro"]
    network_mode: none
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *django
    environment:
      <<: *django-env
      HMS_TRUST_PROXY: "${HMS_TRUST_PROXY:-0}"
      HMS_NUM_PROXIES: "1"
      HMS_ENV: "${HMS_ENV:-local}"
      HMS_HTTPS: "${HMS_HTTPS:-0}"
      HMS_EMAIL_HOST: "${HMS_EMAIL_HOST:-}"
      HMS_EMAIL_PORT: "${HMS_EMAIL_PORT:-587}"
      HMS_EMAIL_USER: "${HMS_EMAIL_USER:-}"
      HMS_EMAIL_PASSWORD: "${HMS_EMAIL_PASSWORD:-}"
      HMS_EMAIL_TLS: "${HMS_EMAIL_TLS:-1}"
      HMS_EMAIL_FROM: "${HMS_EMAIL_FROM:-}"
    volumes: ["private_media:/app/media"]
    networks: [web, data]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import http.client, os, sys;
          c = http.client.HTTPConnection('127.0.0.1', 8000, timeout=4);
          c.request('GET', '/api/v1/auth/me/', headers={'Host': os.environ['HMS_ALLOWED_HOSTS'].split(',')[0].strip(), 'X-Forwarded-Proto': 'https' if os.environ['HMS_HTTPS'] == '1' else 'http'});
          sys.exit(c.getresponse().status != 200)
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    stop_grace_period: 40s
    restart: unless-stopped

  web:
    <<: *unprivileged
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports: ["127.0.0.1:${HMS_HTTP_PORT:-8080}:8080"]
    networks: [web]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  web: {}
  data: { internal: true }

volumes:
  pgdata: {}
  pg_socket: {}
  private_media: {}
