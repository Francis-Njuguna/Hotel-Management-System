worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    # Do not log request URLs (password-reset tokens), bodies, cookies or identities.
    log_format ops '$time_iso8601 $request_method $status $request_time';
    access_log /dev/stdout ops;

    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Docker service addresses can change when a container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $uri $cache_policy {
        default      "private, no-store";
        ~^/assets/   "no-cache";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        client_max_body_size 8m;
        add_header Cache-Control $cache_policy always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        # Neither this container nor the build stage has the private media volume.
        location = /media { return 404; }
        location ^~ /media/ { return 404; }

        # The API emits /api/v1/media/<key>. Both spellings must reach MediaView,
        # which checks the session, capability and DB reference before opening it.
        location = /protected-media { rewrite ^ /api/v1/media/ last; }
        location ^~ /protected-media/ {
            rewrite ^/protected-media/(.*)$ /api/v1/media/$1 last;
        }

        # Preserve the complete URI AND the browser host:port for same-origin CSRF.
        # No alias, proxy cache, static fallback or authentication shortcut here.
        location ~ ^/api(/|$) {
            set $backend api:8000;
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Protocol "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_hide_header Cache-Control;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_buffering off;
            proxy_read_timeout 65s;
        }

        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
